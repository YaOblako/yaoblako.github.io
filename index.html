<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ S-Y-S-T-E-M _ H-A-C-K-E-D ☠️</title>
    <!-- Подключаем хакерские шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Базовая палитра (уровень Threat/Угроза - КРАСНЫЙ) */
            --glow: #ff003c;
            --bg-glow: rgba(255, 0, 60, 0.1);
            --dark-bg: #030001;
            --text-main: #ffd1dc;
            --text-muted: #883344;
            --font-term: 'Fira Code', monospace;
            --font-head: 'Orbitron', sans-serif;
            --ui-border: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        /* --- СОСТОЯНИЕ: ЗАЩИЩЕНО (ЗЕЛЕНЫЙ) --- */
        body.status-safe {
            --glow: #00ff66;
            --bg-glow: rgba(0, 255, 102, 0.1);
            --dark-bg: #000a03;
            --text-main: #e0ffe9;
            --text-muted: #227744;
        }

        /* --- СОСТОЯНИЕ: ЛОЖНЫЙ ХАК / СКАМ (ФИОЛЕТОВЫЙ) --- */
        body.status-trap {
            --glow: #bc13fe;
            --bg-glow: rgba(188, 19, 254, 0.1);
            --dark-bg: #08000a;
            --text-main: #f5dcff;
            --text-muted: #772299;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: var(--font-term);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            transition: all 1s ease-in-out;
        }

        /* Матрица-фон */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            filter: blur(0.5px);
            transition: filter 2s;
        }

        /* CRT Сканлайны и затемнение углов */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.8;
        }
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.9) 120%);
            z-index: 101;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,1);
        }
        
        /* Псевдо-строка загрузки ТВ (анимация развертки сверху вниз) */
        .scanline {
            width: 100%;
            height: 5px;
            z-index: 102;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent, var(--glow), transparent);
            opacity: 0.4;
            animation: crtScan 6s linear infinite;
        }

        @keyframes crtScan {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(110vh); }
        }

        /* Обертка для параллакс-эффекта и 3D */
        .glass-panel-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 750px;
            transform-style: preserve-3d;
        }

        .glass-panel {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            box-shadow: 0 0 40px var(--bg-glow), inset 0 0 30px var(--bg-glow), 0 0 20px #000;
            border: 2px solid var(--glow);
            clip-path: var(--ui-border);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }
        
        /* Угловые прицелы */
        .glass-panel::before {
            content: "sys_core.bin //";
            position: absolute;
            top: -2px; left: 20px;
            font-size: 10px;
            color: var(--glow);
            background: #000;
            padding: 0 5px;
        }

        /* Заголовок с глитчами */
        .glitch-title {
            font-family: var(--font-head);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0 0 15px var(--glow), 0 0 35px var(--glow);
            margin-bottom: 25px;
            letter-spacing: 6px;
        }

        .glitch-title::before, .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark-bg);
        }

        .glitch-title::before {
            left: 3px;
            text-shadow: -2px 0 #00ffff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -3px;
            text-shadow: -2px 0 #ff003c;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim2 3s infinite linear alternate-reverse;
        }

        /* Трекер IP пользователя */
        .user-data-hud {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            border: 1px dashed var(--glow);
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .hud-value {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 5px #fff;
        }

        .terminal-block {
            background: #000;
            border-left: 5px solid var(--glow);
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            box-shadow: inset 0 0 15px var(--bg-glow);
        }

        .terminal-cursor::after {
            content: "█";
            animation: blink 1s step-end infinite;
            color: var(--glow);
            margin-left: 5px;
        }

        .timer-container {
            font-family: var(--font-head);
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow);
            display: inline-block;
            position: relative;
            padding: 0 30px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid var(--glow);
            border-top: 2px solid var(--glow);
        }

        /* Тремор в последние секунды */
        .panic-timer { animation: panicShake 0.4s infinite cubic-bezier(.36,.07,.19,.97); color: #ff0000; text-shadow: 0 0 20px red, 0 0 50px red !important; }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            position: relative;
            z-index: 50;
        }

        .cyber-btn {
            background: rgba(10, 0, 5, 0.8);
            color: #fff;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 20px;
            cursor: pointer;
            border: 1px solid var(--text-muted);
            clip-path: var(--ui-border);
            position: relative;
            transition: all 0.2s;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .cyber-btn:hover {
            border-color: var(--glow);
            background: var(--glow);
            color: var(--dark-bg);
            box-shadow: 0 0 30px var(--glow);
            text-shadow: none;
            transform: translateY(-2px);
        }
        
        .cyber-btn:hover::before { left: 100%; }
        
        .cyber-btn:active { transform: scale(0.98); }
        .cyber-btn:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

        .system-status {
            margin-top: 20px;
            font-size: 0.8rem;
            text-align: right;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Глобальные анимации */
        @keyframes glitch-anim {
            0% { clip: rect(44px, 9999px, 56px, 0); transform: skew(0.5deg); }
            5% { clip: rect(10px, 9999px, 80px, 0); transform: skew(-0.5deg); }
            10% { clip: rect(66px, 9999px, 23px, 0); transform: skew(0.1deg); }
            15% { clip: rect(40px, 9999px, 50px, 0); transform: skew(0.8deg); }
            20% { clip: rect(80px, 9999px, 12px, 0); transform: skew(-0.9deg); }
            25% { clip: rect(32px, 9999px, 86px, 0); transform: skew(0.4deg); }
            30% { clip: rect(78px, 9999px, 34px, 0); transform: skew(-0.7deg); }
            40% { clip: rect(98px, 9999px, 11px, 0); transform: skew(0.3deg); }
            50% { clip: rect(12px, 9999px, 47px, 0); transform: skew(0.5deg); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(0.1deg); }
            15% { clip: rect(24px, 9999px, 76px, 0); transform: skew(-0.7deg); }
            30% { clip: rect(98px, 9999px, 12px, 0); transform: skew(0.4deg); }
            45% { clip: rect(15px, 9999px, 89px, 0); transform: skew(0.6deg); }
            60% { clip: rect(71px, 9999px, 45px, 0); transform: skew(-0.2deg); }
            80% { clip: rect(11px, 9999px, 54px, 0); transform: skew(0.5deg); }
        }

        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes panicShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(-1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(-2px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .fatal-shake { animation: fatal 0.5s ease; }
        @keyframes fatal {
            0% { filter: invert(1); transform: scale(1.1); }
            50% { filter: invert(0) hue-rotate(180deg); transform: scale(0.9); }
            100% { filter: invert(0); transform: scale(1); }
        }
        
        /* Mobile adjustments */
        @media (max-width: 600px) {
            .btn-grid { gap: 10px; }
            .cyber-btn { padding: 15px; font-size: 0.95rem; }
            .glass-panel { padding: 30px 20px; }
        }
    </style>
</head>
<body class="crt">
    <!-- Фоновый движок "Matrix Rain" -->
    <canvas id="matrixCanvas"></canvas>
    <div class="scanline"></div>

    <div class="glass-panel-wrapper" id="panelWrapper">
        <div class="glass-panel" id="mainPanel">
            
            <div class="user-data-hud">
                <span>LOCAL_IP: <span id="mockIP" class="hud-value">SCANNING...</span></span>
                <span>STATUS: <span id="badgeStatus" class="hud-value" style="color: #ff3333">COMPROMISED</span></span>
            </div>

            <h1 class="glitch-title" id="title" data-text="⚠️ ВЗЛОМАН ⚠️">⚠️ ВЗЛОМАН ⚠️</h1>
            
            <div class="terminal-block">
                <span style="color: var(--text-muted)">root@cyber-core:~$ ./execute_verdict.sh -user</span><br>

                <button class="cyber-btn" onclick="sendAction('ДАКНАР ХОРОШИЙ ЧЕЛОВЕК', '😇', true)" style="border-left: 4px solid var(--text-muted)">

        </div>
    </div>

<script>
/**
 * КИБЕРПАНК СИСТЕМА УПРАВЛЕНИЯ ЗАЩИТОЙ
 * - Включает хардкорный таймер
 * - Эффект печати терминала
 * - Симуляция загрузки
 * - Ограничение на копирование и DevTools
 * - Панель управления цветами Canvas'a Matrix (динамика)
 */

(function initCoreSystems() {
    /* 🛡️ 1. ЗАЩИТА СИСТЕМЫ (Иллюзия взлома - отрубаем шорткаты) */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['U','S','P'].includes(e.key.toUpperCase()))) {
            e.preventDefault();
            console.log('%c ДОСТУП В DEVTOOLS ОГРАНИЧЕН ', 'background: #f00; color: #fff; font-size: 20px; font-weight: bold; text-align: center; border-radius: 5px;');
        }
    });

    /* 🧠 2. 3D ПАРАЛЛАКС-ЭФФЕКТ (Иммерсия на Desktop) */
    const wrapper = document.getElementById('panelWrapper');
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 25;
        const y = (window.innerHeight / 2 - e.pageY) / 25;
        wrapper.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    /* 🟢 3. ПОДДЕЛКА IP (Для эффекта слежки) */
    const mockIP = document.getElementById('mockIP');
    let scanCount = 0;
    const ipScanInt = setInterval(() => {
        mockIP.textContent = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        if(++scanCount > 10) {
            clearInterval(ipScanInt);
            // Подменяем на локальную/левую подсеть с пометкой ANONYMOUS
            mockIP.textContent = `192.168.?.? (CLOAKED)`; 
            mockIP.style.color = '#00ff66';
        }
    }, 100);

    /* 📺 4. ВЫВОД В ТЕРМИНАЛ (Пишущая машинка) */
    const termLine = document.getElementById('terminalText');
    async function typeWriterEffect(text, speed = 25) {
        return new Promise(resolve => {
            termLine.textContent = '';
            let i = 0;
            function write() {
                if(i < text.length) {
                    termLine.textContent += text.charAt(i);
                    i++;
                    setTimeout(write, speed + (Math.random()*20)); // плавающая задержка
                } else { resolve(); }
            }
            write();
        });
    }

    /* ⏱️ 5. ДВИЖОК ТАЙМЕРА (Миллисекунды) */
    const timerUI = document.getElementById('timer');
    let timeLeft = 60000; 
    let lastStamp = performance.now();
    let isLocked = false;
    let animFrame = null;

    function renderTimer(currentTime) {
        if(isLocked) return;
        
        let delta = currentTime - lastStamp;
        lastStamp = currentTime;
        timeLeft -= delta;

        if (timeLeft <= 0) {
            timeLeft = 0;
            executeTimeoutLockdown();
            return;
        }

        const secs = Math.floor(timeLeft / 1000);
        const millis = Math.floor((timeLeft % 1000) / 10); // сотые доли

        // Анимация Паники
        if(secs <= 10 && !timerUI.classList.contains('panic-timer')) {
            timerUI.classList.add('panic-timer');
        }

        timerUI.textContent = `00:${String(secs).padStart(2, '0')}.${String(millis).padStart(2, '0')}`;
        animFrame = requestAnimationFrame(renderTimer);
    }

    function executeTimeoutLockdown() {
        isLocked = true;
        lockUI();
        document.body.classList.remove('status-safe', 'status-trap');
        
        timerUI.textContent = "00:00.00";
        document.getElementById('title').textContent = "SYSTEM_FAIL";
        document.getElementById('title').setAttribute('data-text', "SYSTEM_FAIL");
        typeWriterEffect("> ВРЕМЯ ВЫШЛО. БАЗА ДАННЫХ УДАЛЕНА. ОТКЛЮЧЕНИЕ СИСТЕМЫ...");
        document.getElementById('mainPanel').classList.add('fatal-shake');
        setMatrixColor('#ff0000');
    }

    animFrame = requestAnimationFrame(renderTimer);

    /* 🔗 6. ЛОГИКА ВЕБХУКОВ И ВЕРДИКТОВ */
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1536781549452787842/Cir5Tad8gvfy53OkWDyExr67qWPjjuXNlLWUSrMkOmP2o2FB7bFlvVqgE1507klMKp9Z';

    function lockUI() {
        document.querySelectorAll('.cyber-btn').forEach(b => b.disabled = true);
    }

    window.sendAction = async (actionLabel, actionEmoji, isGood) => {
        if (isLocked) return;
        isLocked = true;
        lockUI();

        // 1. Анимация начала отправки
        document.getElementById('mainPanel').classList.add('fatal-shake');
        timerUI.classList.remove('panic-timer');
        timerUI.style.opacity = '0.3';
        document.getElementById('systemFooter').textContent = "[ BYPASSING FIREWALL... CONNECTING ]";
        
        await typeWriterEffect("> ПРОЦЕСС ЗАПУЩЕН... КОДИРОВАНИЕ ПАКЕТА...");
        
        const sysDetails = `Device: ${/Mobile|Android|iPhone/i.test(navigator.userAgent)?'📱 Phone':'💻 PC/Desktop'}\nUplink_IP: ${mockIP.textContent}`;
        const embedCore = { timestamp: new Date().toISOString() };

        if(isGood) {
            embedCore.title = "⚠️ LETHAL TRAP ACTIVATED: ЛОЖНЫЙ ХАК";
            embedCore.color = 0xbc13fe; // Пурпурный киберпанк
            embedCore.description = `\`\`\`diff\n- ERROR: ИЛЛЮЗИЯ ВЗЛОМА\n\`\`\`\nВыбор: **"${actionLabel}"**\n> Пользователь попытался спасти Дакнара, посчитав его хорошим.\n> СИСТЕМА КОМПРОМЕТИРОВАНА.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        } else {
            embedCore.title = "🛡️ THREAT NEUTRALIZED";
            embedCore.color = 0x00ff66;
            embedCore.description = `\`\`\`diff\n+ БЕЗОПАСНОСТЬ ВОССТАНОВЛЕНА\n\`\`\`\nСделан правильный выбор: **"${actionLabel}"**\n> Хакерские скрипты очищены.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        }

        try {
            const resp = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: `>>> СЕРВЕР ОБРАБОТАЛ НОВУЮ РЕАКЦИЮ: ${actionEmoji}`,
                    embeds: [embedCore] 
                })
            });

            document.getElementById('mainPanel').classList.remove('fatal-shake');

            if(resp.ok) {
                // Изменяем мир игры
                if(isGood) {
                    // ФИНАЛ: ЛОЖНЫЙ ХАК / СКАМ
                    document.body.classList.add('status-trap');
                    setMatrixColor('#bc13fe');
                    
                    document.getElementById('badgeStatus').textContent = "FATAL ERROR";
                    document.getElementById('badgeStatus').style.color = "#bc13fe";
                    
                    document.getElementById('title').textContent = "ХАК НИКУДА НЕ УХОДИЛ";
                    document.getElementById('title').setAttribute('data-text', "ХАК НИКУДА НЕ УХОДИЛ");
                    
                    typeWriterEffect(`> ${actionLabel}... Серьезно? 
> Это ЛОВУШКА. Твои данные скомпрометированы окончательно.
> Запущено копирование диска C://...`, 15);
                    
                } else {
                    // ФИНАЛ: СПАСЕН
                    document.body.classList.add('status-safe');
                    setMatrixColor('#00ff66');
                    
                    document.getElementById('badgeStatus').textContent = "SECURE";
                    document.getElementById('badgeStatus').style.color = "#00ff66";
                    
                    document.getElementById('title').textContent = "ЗАЩИТА ВЕРНУЛАСЬ";
                    document.getElementById('title').setAttribute('data-text', "ЗАЩИТА ВЕРНУЛАСЬ");
                    
                    typeWriterEffect(`> ВЫБОР ${actionLabel} ПОДТВЕРЖДЕН.
> Запуск алгоритмов безопасности... Успешно.
> Система чиста. Удачной охоты, гражданин.`, 30);
                }
                
                document.getElementById('systemFooter').textContent = "[ ПОДТВЕРЖДЕНО СЕРВЕРОМ ] // ОПЕРАЦИЯ ЗАВЕРШЕНА";

            } else {
                throw new Error("Discord Hook Error");
            }

        } catch(e) {
            document.body.classList.remove('status-trap', 'status-safe');
            setMatrixColor('#ff003c'); // краснеет от бешенства
            typeWriterEffect("> ОШИБКА 502_BAD_GATEWAY... [ УЗЕЛ НЕДОСТУПЕН ]", 40);
        }
    };

})();

/* 🖧 7. СКРИПТ АНИМАЦИИ ЦИФРОВОГО ДОЖДЯ "МАТРИЦЫ" (CANVAS) */
const cvs = document.getElementById('matrixCanvas');
const ctx = cvs.getContext('2d');

let cw = cvs.width = window.innerWidth;
let ch = cvs.height = window.innerHeight;

let font_size = 14;
let columns = cw / font_size;
let drops = [];
for(let x = 0; x < columns; x++) drops[x] = Math.random() * ch;

// Динамические символы кириллица/япония/хакерские hex 
const hexMatrix = "ХАКСИСТЕМАДАКНАР0123456789AZBXC█▓▒░ABCDEFGHIJKLMNOPQRSTUVWXYZアァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン";
let hexChars = hexMatrix.split("");

// Текущий цвет отрисовки (связано с классами Body css)
let mColor = '#ff003c'; 
window.setMatrixColor = (c) => mColor = c;

window.addEventListener('resize', () => {
    cw = cvs.width = window.innerWidth;
    ch = cvs.height = window.innerHeight;
    columns = Math.floor(cw / font_size);
    drops = [];
    for(let x = 0; x < columns; x++) drops[x] = Math.random() * ch;
});

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, cw, ch);
    ctx.font = font_size + "px 'Fira Code', monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = hexChars[Math.floor(Math.random() * hexChars.length)];
        ctx.fillStyle = (Math.random() > 0.98) ? "#fff" : mColor; // редкие белые символы
        
        ctx.fillText(text, i * font_size, drops[i] * font_size);
        
        if (drops[i] * font_size > ch && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(drawMatrix, 35); // 35мс отрисовка - высокая плавность

</script>
