<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления безопасностью</title>
    <!-- Современные шрифты Inter и Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(18, 24, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        /* --- СОСТОЯНИЯ СИСТЕМЫ --- */
        body.status-safe {
            --accent-red: #10b981;
        }
        body.status-trap {
            --accent-red: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Мягкое фоновое свечение вместо матрицы */
        .ambient-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            transition: background 0.8s ease;
        }

        body.status-safe .ambient-bg {
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
        }

        body.status-trap .ambient-bg {
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
        }

        /* Скрытый холст для совместимости со скриптом матрицы */
        #matrixCanvas {
            display: none;
        }

        /* Карточка панели */
        .glass-panel-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            perspective: 1000px;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: border-color 0.3s ease, transform 0.2s ease;
        }

        /* Верхняя панель HUD */
        .user-data-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
        
        .hud-value {
            color: #fff;
            font-weight: 600;
        }

        .badge-status {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        /* Чистый заголовок */
        .glitch-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Терминал */
        .terminal-block {
            background: #030712;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 20px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
            color: #e2e8f0;
        }

        .terminal-cursor::after {
            content: "▋";
            animation: blink 1s step-end infinite;
            color: var(--accent-red);
            margin-left: 4px;
        }

        /* Таймер */
        .timer-container {
            font-family: var(--font-mono);
            font-size: 2.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
            letter-spacing: -1px;
        }

        .panic-timer { 
            color: var(--accent-red); 
            animation: panicShake 0.4s infinite cubic-bezier(.36,.07,.19,.97); 
        }

        /* Сетка кнопок */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            position: relative;
            z-index: 50;
        }

        .cyber-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #f8fafc;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 16px 20px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .cyber-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }
        
        .cyber-btn:active { transform: translateY(0); }
        .cyber-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .system-status {
            margin-top: 24px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* Анимации */
        @keyframes blink { 50% { opacity: 0; } }
        
        @keyframes panicShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        .fatal-shake { animation: fatal 0.4s ease; }
        @keyframes fatal {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.98); }
        }
        
        @media (max-width: 600px) {
            .glass-panel { padding: 24px 20px; border-radius: 20px; }
            .glitch-title { font-size: 1.4rem; }
            .timer-container { font-size: 2.2rem; }
            .cyber-btn { padding: 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <canvas id="matrixCanvas"></canvas>

    <div class="glass-panel-wrapper" id="panelWrapper">
        <div class="glass-panel" id="mainPanel">
            
            <div class="user-data-hud">
                <span>IP: <span id="mockIP" class="hud-value">SCANNING...</span></span>
                <span id="badgeStatus" class="badge-status">COMPROMISED</span>
            </div>

            <h1 class="glitch-title" id="title" data-text="⚠️ ВЗЛОМАН ⚠️">⚠️ ВЗЛОМАН ⚠️</h1>
            
            <div class="terminal-block">
                <span style="color: var(--text-muted)">root@cyber-core:~$ ./execute_verdict.sh -user</span><br>
                > СИСТЕМА ИДЕНТИФИЦИРОВАЛА ЦЕЛЬ:<br>
                > <span style="color:#fff; font-weight:bold;">"ДАКНАР"</span> - Анализ... <br>
                <span id="terminalText" class="terminal-cursor">Жду твоего приговора для остановки выкачки...</span>
            </div>

            <div class="timer-container" id="timer">00:59.99</div>

            <div class="btn-grid">
                <button class="cyber-btn" onclick="sendAction('ДОЛБОЕБ ДАКНАР', '🤬', false)">
                    <span>🤬</span> ДОЛБОЕБ ДАКНАР
                </button>
                <button class="cyber-btn" onclick="sendAction('ПИДАРАС', '🍆', false)">
                    <span>🍆</span> ПИДАРАС
                </button>
                <button class="cyber-btn" onclick="sendAction('ПИЗДАБОЛ ДАКНАР', '🗣️', false)">
                    <span>🗣️</span> ПИЗДАБОЛ ДАКНАР
                </button>
                <button class="cyber-btn" onclick="sendAction('ДАКНАР ХОРОШИЙ ЧЕЛОВЕК', '😇', true)">
                    <span>😇</span> ДАКНАР ХОРОШИЙ ЧЕЛОВЕК
                </button>
            </div>

            <div class="system-status" id="systemFooter">
                [ СОЕДИНЕНИЕ ЗАШИФРОВАНО RSA-4096 ] // UPLINK 0.0MB/S
            </div>
        </div>
    </div>

<script>
(function initCoreSystems() {
    /* 🛡️ 1. ЗАЩИТА СИСТЕМЫ */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['U','S','P'].includes(e.key.toUpperCase()))) {
            e.preventDefault();
        }
    });

    /* 🧠 2. ЛЕГКИЙ ПАРАЛЛАКС-ЭФФЕКТ */
    const wrapper = document.getElementById('panelWrapper');
    document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        wrapper.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    /* 🟢 3. ПОДДЕЛКА IP */
    const mockIP = document.getElementById('mockIP');
    let scanCount = 0;
    const ipScanInt = setInterval(() => {
        mockIP.textContent = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        if(++scanCount > 10) {
            clearInterval(ipScanInt);
            mockIP.textContent = `192.168.?.? (CLOAKED)`; 
            mockIP.style.color = '#10b981';
        }
    }, 100);

    /* 📺 4. ВЫВОД В ТЕРМИНАЛ */
    const termLine = document.getElementById('terminalText');
    async function typeWriterEffect(text, speed = 25) {
        return new Promise(resolve => {
            termLine.textContent = '';
            let i = 0;
            function write() {
                if(i < text.length) {
                    termLine.textContent += text.charAt(i);
                    i++;
                    setTimeout(write, speed + (Math.random()*20));
                } else { resolve(); }
            }
            write();
        });
    }

    /* ⏱️ 5. ДВИЖОК ТАЙМЕРА */
    const timerUI = document.getElementById('timer');
    let timeLeft = 60000; 
    let lastStamp = performance.now();
    let isLocked = false;
    let animFrame = null;

    function renderTimer(currentTime) {
        if(isLocked) return;
        
        let delta = currentTime - lastStamp;
        lastStamp = currentTime;
        timeLeft -= delta;

        if (timeLeft <= 0) {
            timeLeft = 0;
            executeTimeoutLockdown();
            return;
        }

        const secs = Math.floor(timeLeft / 1000);
        const millis = Math.floor((timeLeft % 1000) / 10);

        if(secs <= 10 && !timerUI.classList.contains('panic-timer')) {
            timerUI.classList.add('panic-timer');
        }

        timerUI.textContent = `00:${String(secs).padStart(2, '0')}.${String(millis).padStart(2, '0')}`;
        animFrame = requestAnimationFrame(renderTimer);
    }

    function executeTimeoutLockdown() {
        isLocked = true;
        lockUI();
        document.body.classList.remove('status-safe', 'status-trap');
        
        timerUI.textContent = "00:00.00";
        document.getElementById('title').textContent = "SYSTEM_FAIL";
        typeWriterEffect("> ВРЕМЯ ВЫШЛО. БАЗА ДАННЫХ УДАЛЕНА. ОТКЛЮЧЕНИЕ СИСТЕМЫ...");
        document.getElementById('mainPanel').classList.add('fatal-shake');
    }

    animFrame = requestAnimationFrame(renderTimer);

    /* 🔗 6. ЛОГИКА ВЕБХУКОВ */
    const WEBHOOK_URL = 'https://discord-proxy.tal2laz10.workers.dev';

    function lockUI() {
        document.querySelectorAll('.cyber-btn').forEach(b => b.disabled = true);
    }

    window.sendAction = async (actionLabel, actionEmoji, isGood) => {
        if (isLocked) return;
        isLocked = true;
        lockUI();

        document.getElementById('mainPanel').classList.add('fatal-shake');
        timerUI.classList.remove('panic-timer');
        timerUI.style.opacity = '0.3';
        document.getElementById('systemFooter').textContent = "[ CONNECTING TO SERVER... ]";
        
        await typeWriterEffect("> ПРОЦЕСС ЗАПУЩЕН... КОДИРОВАНИЕ ПАКЕТА...");
        
        const sysDetails = `Device: ${/Mobile|Android|iPhone/i.test(navigator.userAgent)?'📱 Phone':'💻 PC/Desktop'}\nUplink_IP: ${mockIP.textContent}`;
        const embedCore = { timestamp: new Date().toISOString() };

        if(isGood) {
            embedCore.title = "⚠️ LETHAL TRAP ACTIVATED: ЛОЖНЫЙ ХАК";
            embedCore.color = 0xbc13fe;
            embedCore.description = `\`\`\`diff\n- ERROR: ИЛЛЮЗИЯ ВЗЛОМА\n\`\`\`\nВыбор: **"${actionLabel}"**\n> Пользователь попытался спасти Дакнара, посчитав его хорошим.\n> СИСТЕМА КОМПРОМЕТИРОВАНА.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        } else {
            embedCore.title = "🛡️ THREAT NEUTRALIZED";
            embedCore.color = 0x00ff66;
            embedCore.description = `\`\`\`diff\n+ БЕЗОПАСНОСТЬ ВОССТАНОВЛЕНА\n\`\`\`\nСделан правильный выбор: **"${actionLabel}"**\n> Хакерские скрипты очищены.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        }

        try {
            const resp = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: `>>> СЕРВЕР ОБРАБОТАЛ НОВУЮ РЕАКЦИЮ: ${actionEmoji}`,
                    embeds: [embedCore] 
                })
            });

            document.getElementById('mainPanel').classList.remove('fatal-shake');

            if(resp.ok) {
                if(isGood) {
                    document.body.classList.add('status-trap');
                    
                    const badge = document.getElementById('badgeStatus');
                    badge.textContent = "FATAL ERROR";
                    badge.style.background = "rgba(168, 85, 247, 0.15)";
                    badge.style.color = "#a855f7";
                    
                    document.getElementById('title').textContent = "ХАК НИКУДА НЕ УХОДИЛ";
                    
                    typeWriterEffect(`> ${actionLabel}... Серьезно? 
> Это ЛОВУШКА. Твои данные скомпрометированы окончательно.
> Запущено копирование диска C://...`, 15);
                    
                } else {
                    document.body.classList.add('status-safe');
                    
                    const badge = document.getElementById('badgeStatus');
                    badge.textContent = "SECURE";
                    badge.style.background = "rgba(16, 185, 129, 0.15)";
                    badge.style.color = "#10b981";
                    
                    document.getElementById('title').textContent = "ЗАЩИТА ВЕРНУЛАСЬ";
                    
                    typeWriterEffect(`> ВЫБОР ${actionLabel} ПОДТВЕРЖДЕН.
> Запуск алгоритмов безопасности... Успешно.
> Система чиста. Удачной охоты, гражданин.`, 30);
                }
                
                document.getElementById('systemFooter').textContent = "[ ПОДТВЕРЖДЕНО СЕРВЕРОМ ] // ОПЕРАЦИЯ ЗАВЕРШЕНА";

            } else {
                throw new Error("Discord Hook Error");
            }

        } catch(e) {
            document.body.classList.remove('status-trap', 'status-safe');
            typeWriterEffect("> ОШИБКА 502_BAD_GATEWAY... [ УЗЕЛ НЕДОСТУПЕН ]", 40);
        }
    };

})();

/* Заглушка для внешних вызовов цвета */
window.setMatrixColor = () => {};
</script>
</body>
</html>
