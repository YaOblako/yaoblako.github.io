*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'gg sans','Noto Sans',system-ui,sans-serif;
  background:#18004D linear-gradient(135deg,#18004D 0%,#1B0960 40%,#234FD8 80%,#0F7FF0 100%);
  min-height:100vh;overflow:hidden;color:#DBDEE1;
  -webkit-font-smoothing:antialiased;
}
.bg-art{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.bg-stars{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;pointer-events:none;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
.logo{position:fixed;top:48px;left:48px;width:124px;height:24px}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{
  background:#393A41;border-radius:8px;width:480px;max-width:100%;
  padding:32px;text-align:center;
  box-shadow:0 12px 24px rgba(0,0,0,.35);
}
.avatar{width:80px;height:80px;border-radius:24px;object-fit:cover;margin-bottom:16px}
.subtitle{font-size:16px;line-height:20px;color:#B5BAC1;margin-bottom:8px}
h1{font-size:24px;line-height:30px;font-weight:600;color:#F2F3F5;margin-bottom:8px}
.tagline{font-size:14px;line-height:18px;color:#B5BAC1;margin-bottom:20px}
.btn{
  display:block;width:100%;border:0;border-radius:4px;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:500;line-height:20px;
  padding:12px 16px;margin-top:12px;color:#fff;
  transition:background-color .17s ease;
}
.btn-primary{background:#5865F2}
.btn-primary:hover{background:#4752C4}
.btn-primary:active{background:#3C45A5}
.btn-secondary{background:#4E5058}
.btn-secondary:hover{background:#6D6F78}
.btn-secondary:active{background:#3F4147}
.btn:focus-visible{outline:2px solid #00A8FC;outline-offset:2px}
@media (max-width:560px){
  .logo{top:24px;left:24px}
  .card{padding:24px 16px}
}
@media (prefers-reduced-motion:reduce){
  .bg-stars{animation:none}
}
</style>
