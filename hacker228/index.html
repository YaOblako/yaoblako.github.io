<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система управления безопасностью</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(18, 24, 38, 0.9);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "Fira Code", Consolas, monospace;
    }

    body.status-safe { --accent-red: var(--accent-green); }
    body.status-trap { --accent-red: var(--accent-purple); }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      width: min(760px, 100vw);
      aspect-ratio: 1;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.13) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: background 0.8s ease;
    }

    body.status-safe .ambient-bg {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.13) 0%, transparent 70%);
    }

    body.status-trap .ambient-bg {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.13) 0%, transparent 70%);
    }

    .glass-panel-wrapper {
      position: relative;
      z-index: 1;
      width: min(100%, 640px);
      perspective: 1000px;
      transition: transform 0.16s ease-out;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .user-data-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 24px;
      font: 500 0.85rem/1.4 var(--font-mono);
      color: var(--text-muted);
    }

    .hud-value {
      color: #fff;
      font-weight: 700;
    }

    .badge-status {
      flex: 0 0 auto;
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .glitch-title {
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .terminal-block {
      min-height: 132px;
      background: #030712;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 18px 20px;
      font: 500 0.88rem/1.65 var(--font-mono);
      margin-bottom: 24px;
      text-align: left;
      color: #e2e8f0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .terminal-command { color: var(--text-muted); }

    .terminal-cursor::after {
      content: "▋";
      animation: blink 1s step-end infinite;
      color: var(--accent-red);
      margin-left: 4px;
    }

    .timer-container {
      font: 700 clamp(2.1rem, 9vw, 2.75rem)/1.2 var(--font-mono);
      color: #fff;
      margin-bottom: 24px;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.035);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: inline-block;
      letter-spacing: -0.04em;
      transition: opacity 0.2s ease;
    }

    .panic-timer {
      color: var(--accent-red);
      animation: panicShake 0.4s infinite cubic-bezier(.36,.07,.19,.97);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .cyber-btn {
      min-height: 52px;
      background: rgba(255, 255, 255, 0.045);
      color: #f8fafc;
      font: 600 0.95rem/1.3 var(--font-main);
      padding: 14px 20px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .cyber-btn:hover {
      background: rgba(255, 255, 255, 0.085);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .cyber-btn:active { transform: translateY(0); }
    .cyber-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .cyber-btn:focus-visible { outline: 3px solid rgba(94, 159, 232, 0.55); outline-offset: 2px; }

    .system-status {
      min-height: 18px;
      margin-top: 24px;
      font: 500 0.75rem/1.5 var(--font-mono);
      text-align: center;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes panicShake {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 1px); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-1px, -1px); }
      80% { transform: translate(1px, 1px); }
    }
    @keyframes fatal {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.985); }
    }
    .fatal-shake { animation: fatal 0.4s ease; }

    @media (max-width: 600px) {
      body { padding: 16px; align-items: flex-start; }
      .glass-panel { padding: 24px 20px; border-radius: 20px; }
      .user-data-hud { align-items: flex-start; font-size: 0.72rem; }
      .terminal-block { min-height: 142px; padding: 16px; font-size: 0.78rem; }
      .cyber-btn { font-size: 0.86rem; padding: 13px 12px; }
      .system-status { font-size: 0.68rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <main class="glass-panel-wrapper" id="panelWrapper">
    <section class="glass-panel" id="mainPanel" aria-labelledby="title">
      <div class="user-data-hud">
        <span>IP: <span id="mockIP" class="hud-value">SCANNING...</span></span>
        <span id="badgeStatus" class="badge-status">COMPROMISED</span>
      </div>

      <h1 class="glitch-title" id="title">⚠️ ВЗЛОМАН ⚠️</h1>

      <div class="terminal-block" aria-live="polite"><span class="terminal-command">root@cyber-core:~$ ./execute_verdict.sh -user</span>
&gt; СИСТЕМА ИДЕНТИФИЦИРОВАЛА ЦЕЛЬ:
&gt; <strong>"ДАКНАР"</strong> — Анализ...
<span id="terminalText" class="terminal-cursor">Жду твоего приговора для остановки выкачки...</span></div>

      <div class="timer-container" id="timer" aria-label="Оставшееся время">00:59.99</div>

      <div class="btn-grid">
        <button type="button" class="cyber-btn" data-label="ДОЛБОЕБ ДАКНАР" data-emoji="🤬" data-good="false"><span>🤬</span> ДОЛБОЕБ ДАКНАР</button>
        <button type="button" class="cyber-btn" data-label="ПИДАРАС" data-emoji="🍆" data-good="false"><span>🍆</span> ПИДАРАС</button>
        <button type="button" class="cyber-btn" data-label="ПИЗДАБОЛ ДАКНАР" data-emoji="🗣️" data-good="false"><span>🗣️</span> ПИЗДАБОЛ ДАКНАР</button>
        <button type="button" class="cyber-btn" data-label="ДАКНАР ХОРОШИЙ ЧЕЛОВЕК" data-emoji="😇" data-good="true"><span>😇</span> ДАКНАР ХОРОШИЙ ЧЕЛОВЕК</button>
      </div>

      <div class="system-status" id="systemFooter">[ СОЕДИНЕНИЕ ЗАШИФРОВАНО RSA-4096 ] // UPLINK 0.0MB/S</div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const WEBHOOK_URL = "https://yaoblako-proxy.tal2laz10.workers.dev/";
      const wrapper = document.getElementById("panelWrapper");
      const mainPanel = document.getElementById("mainPanel");
      const mockIP = document.getElementById("mockIP");
      const termLine = document.getElementById("terminalText");
      const timerUI = document.getElementById("timer");
      const footer = document.getElementById("systemFooter");
      const title = document.getElementById("title");
      const badge = document.getElementById("badgeStatus");
      const buttons = [...document.querySelectorAll(".cyber-btn")];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let timeLeft = 60000;
      let lastStamp = performance.now();
      let isLocked = false;
      let typingRun = 0;

      if (!reduceMotion && window.matchMedia("(pointer: fine)").matches) {
        document.addEventListener("mousemove", (event) => {
          if (isLocked) return;
          const x = (window.innerWidth / 2 - event.clientX) / 55;
          const y = (window.innerHeight / 2 - event.clientY) / 55;
          wrapper.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
        document.addEventListener("mouseleave", () => {
          wrapper.style.transform = "rotateY(0deg) rotateX(0deg)";
        });
      }

      let scanCount = 0;
      const ipScanInterval = window.setInterval(() => {
        mockIP.textContent = Array.from({ length: 4 }, () => Math.floor(Math.random() * 256)).join(".");
        scanCount += 1;
        if (scanCount > 10) {
          clearInterval(ipScanInterval);
          mockIP.textContent = "192.168.?.? (CLOAKED)";
          mockIP.style.color = "#10b981";
        }
      }, 100);

      function typeWriterEffect(text, speed = 25) {
        const runId = ++typingRun;
        termLine.textContent = "";

        if (reduceMotion) {
          termLine.textContent = text;
          return Promise.resolve();
        }

        return new Promise((resolve) => {
          let index = 0;
          const write = () => {
            if (runId !== typingRun) return resolve();
            if (index < text.length) {
              termLine.textContent += text.charAt(index++);
              setTimeout(write, speed + Math.random() * 20);
            } else {
              resolve();
            }
          };
          write();
        });
      }

      function lockUI() {
        buttons.forEach((button) => { button.disabled = true; });
      }

      function unlockUI() {
        isLocked = false;
        lastStamp = performance.now();
        buttons.forEach((button) => { button.disabled = false; });
        timerUI.style.opacity = "1";
        requestAnimationFrame(renderTimer);
      }

      function executeTimeoutLockdown() {
        isLocked = true;
        lockUI();
        document.body.classList.remove("status-safe", "status-trap");
        timerUI.textContent = "00:00.00";
        title.textContent = "SYSTEM_FAIL";
        footer.textContent = "[ CONNECTION TERMINATED ]";
        mainPanel.classList.add("fatal-shake");
        void typeWriterEffect("> ВРЕМЯ ВЫШЛО. БАЗА ДАННЫХ УДАЛЕНА. ОТКЛЮЧЕНИЕ СИСТЕМЫ...");
      }

      function renderTimer(currentTime) {
        if (isLocked) return;
        timeLeft -= currentTime - lastStamp;
        lastStamp = currentTime;

        if (timeLeft <= 0) {
          timeLeft = 0;
          executeTimeoutLockdown();
          return;
        }

        const seconds = Math.floor(timeLeft / 1000);
        const hundredths = Math.floor((timeLeft % 1000) / 10);
        timerUI.textContent = `00:${String(seconds).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;

        if (seconds <= 10) timerUI.classList.add("panic-timer");
        requestAnimationFrame(renderTimer);
      }

      async function sendAction(actionLabel, actionEmoji, isGood) {
        if (isLocked) return;
        isLocked = true;
        lockUI();

        mainPanel.classList.add("fatal-shake");
        timerUI.classList.remove("panic-timer");
        timerUI.style.opacity = "0.35";
        footer.textContent = "[ CONNECTING TO SERVER... ]";
        await typeWriterEffect("> ПРОЦЕСС ЗАПУЩЕН... КОДИРОВАНИЕ ПАКЕТА...");

        const device = /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "📱 Phone" : "💻 PC/Desktop";
        const sysDetails = `Device: ${device}\nUplink_IP: ${mockIP.textContent}`;
        const embedCore = { timestamp: new Date().toISOString() };

        if (isGood) {
          embedCore.title = "⚠️ LETHAL TRAP ACTIVATED: ЛОЖНЫЙ ХАК";
          embedCore.color = 0xbc13fe;
          embedCore.description = `\`\`\`diff\n- ERROR: ИЛЛЮЗИЯ ВЗЛОМА\n\`\`\`\nВыбор: **"${actionLabel}"**\n> Пользователь попытался спасти Дакнара, посчитав его хорошим.\n> СИСТЕМА КОМПРОМЕТИРОВАНА.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        } else {
          embedCore.title = "🛡️ THREAT NEUTRALIZED";
          embedCore.color = 0x00ff66;
          embedCore.description = `\`\`\`diff\n+ БЕЗОПАСНОСТЬ ВОССТАНОВЛЕНА\n\`\`\`\nСделан правильный выбор: **"${actionLabel}"**\n> Хакерские скрипты очищены.\n\n\`[ СРЕДА РАБОТЫ ]\`\n${sysDetails}`;
        }

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content: `>>> СЕРВЕР ОБРАБОТАЛ НОВУЮ РЕАКЦИЮ: ${actionEmoji}`,
              embeds: [embedCore]
            })
          });

          const responseText = await response.text();
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText || "пустой ответ"}`);
          }

          mainPanel.classList.remove("fatal-shake");

          if (isGood) {
            document.body.classList.remove("status-safe");
            document.body.classList.add("status-trap");
            badge.textContent = "FATAL ERROR";
            badge.style.background = "rgba(168, 85, 247, 0.15)";
            badge.style.color = "#a855f7";
            title.textContent = "ХАК НИКУДА НЕ УХОДИЛ";
            await typeWriterEffect(`> ${actionLabel}... Серьезно?\n> Это ЛОВУШКА. Твои данные скомпрометированы окончательно.\n> Запущено копирование диска C://...`, 15);
          } else {
            document.body.classList.remove("status-trap");
            document.body.classList.add("status-safe");
            badge.textContent = "SECURE";
            badge.style.background = "rgba(16, 185, 129, 0.15)";
            badge.style.color = "#10b981";
            title.textContent = "ЗАЩИТА ВЕРНУЛАСЬ";
            await typeWriterEffect(`> ВЫБОР ${actionLabel} ПОДТВЕРЖДЕН.\n> Запуск алгоритмов безопасности... Успешно.\n> Система чиста. Удачной охоты, гражданин.`, 30);
          }

          footer.textContent = "[ ПОДТВЕРЖДЕНО СЕРВЕРОМ ] // ОПЕРАЦИЯ ЗАВЕРШЕНА";
        } catch (error) {
          document.body.classList.remove("status-trap", "status-safe");
          mainPanel.classList.remove("fatal-shake");
          footer.textContent = "[ CONNECTION FAILED — МОЖНО ПОВТОРИТЬ ]";
          await typeWriterEffect(`> ОШИБКА СЕТИ: ${error instanceof Error ? error.message : String(error)}`, 15);
          unlockUI();
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          void sendAction(button.dataset.label, button.dataset.emoji, button.dataset.good === "true");
        });
      });

      requestAnimationFrame(renderTimer);
    })();
  </script>
</body>
</html>
