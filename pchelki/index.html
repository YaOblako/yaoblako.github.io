<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ты уважаешь пчёлок???</title>
    <style>
        :root {
            --gold: #ffb703;
            --amber: #fb8500;
            --dark: #141416;
            --yes-grad: linear-gradient(135deg, #38b000, #70e000);
            --no-grad: linear-gradient(135deg, #d90429, #ef233c);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #fff3b0 0%, #ffb703 55%, #fb8500 100%);
            padding: 20px;
            overflow: hidden;
            transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            perspective: 1200px;
        }

        body.no-mode {
            background: radial-gradient(circle at center, #2b090e 0%, #0d0204 100%);
        }

        body.yes-mode {
            background: radial-gradient(circle at center, #d8f3dc 0%, #74c69d 50%, #40916c 100%);
        }

        body.game-active {
            cursor: none;
        }

        /* Паттерн сот на фоне */
        .honeycomb-bg {
            position: fixed;
            inset: 0;
            opacity: 0.14;
            background-image: radial-gradient(#000 15%, transparent 16%),
                              radial-gradient(#000 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        body.no-mode .honeycomb-bg {
            opacity: 0.25;
            background-image: radial-gradient(#ff002b 15%, transparent 16%),
                              radial-gradient(#ff002b 15%, transparent 16%);
        }

        /* Canvas для частиц и мини-игры */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        body.game-active #particleCanvas {
            z-index: 15;
            pointer-events: auto;
        }

        /* Фоновая гифка */
        .bg-gif {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.7s ease;
            z-index: 1;
            pointer-events: none;
        }
        .bg-gif.active { opacity: 1; }
        .bg-gif::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(20, 0, 5, 0.45) 0%, rgba(0, 0, 0, 0.85) 100%);
        }

        /* Красная тревожная виньетка */
        .siren-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 43, 0.45) 100%);
        }
        body.no-mode .siren-overlay {
            animation: sirenPulse 1.1s ease-in-out infinite alternate;
        }
        @keyframes sirenPulse {
            0% { opacity: 0.15; }
            100% { opacity: 0.85; }
        }

        /* Верхняя панель управления */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 183, 3, 0.6);
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:hover {
            transform: translateY(-2px);
            background: #fff;
        }

        /* HUD мини-игры */
        .game-hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            z-index: 25;
            background: rgba(15, 5, 10, 0.9);
            backdrop-filter: blur(14px);
            border: 2px solid #ff2a55;
            border-radius: 24px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 28px;
            color: #fff;
            box-shadow: 0 15px 40px rgba(255, 30, 66, 0.4);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .game-hud.active {
            transform: translateX(-50%) translateY(0);
        }

        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .hud-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fda4af;
            font-weight: 700;
        }
        .hud-value {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 900;
            color: #00f5d4;
        }

        .game-tip {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            text-align: center;
        }
        .game-tip.active {
            opacity: 1;
        }

        /* Главная карточка */
        .card {
            position: relative;
            z-index: 5;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 44px 36px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.28),
                        inset 0 0 0 2px rgba(255, 255, 255, 0.6);
            border: 3px solid var(--gold);
            transform-style: preserve-3d;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card.hidden-for-game {
            opacity: 0;
            transform: scale(0.8) translateY(40px) !important;
            pointer-events: none;
        }

        .card.no-mode {
            background: rgba(20, 12, 16, 0.92);
            border-color: #ff1e42;
            color: #fff;
            box-shadow: 0 0 60px rgba(255, 30, 66, 0.45),
                        inset 0 0 25px rgba(255, 30, 66, 0.2);
        }

        .card.yes-mode {
            border-color: #38b000;
            box-shadow: 0 25px 70px rgba(56, 176, 0, 0.35);
        }

        .shake {
            animation: shakeAnim 0.55s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-4px, 2px, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(6px, -2px, 0) rotate(1.5deg); }
            30%, 50%, 70% { transform: translate3d(-8px, -3px, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(8px, 3px, 0) rotate(2deg); }
        }

        /* Иконка пчёлки */
        .bee-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .bee-icon {
            font-size: 72px;
            display: block;
            filter: drop-shadow(0 12px 16px rgba(0,0,0,0.18));
            animation: floatBee 2.8s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .bee-icon:hover {
            transform: scale(1.15) rotate(8deg);
        }

        @keyframes floatBee {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-14px) rotate(5deg); }
        }

        .status-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(255, 183, 3, 0.2);
            color: #9a5b00;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 183, 3, 0.5);
        }
        .card.no-mode .status-badge {
            background: rgba(255, 30, 66, 0.2);
            color: #ff6b81;
            border-color: rgba(255, 30, 66, 0.5);
        }
        .card.yes-mode .status-badge {
            background: rgba(56, 176, 0, 0.18);
            color: #2b8a00;
            border-color: rgba(56, 176, 0, 0.4);
        }

        h1 {
            font-size: 30px;
            font-weight: 900;
            color: #1f1f1f;
            margin-bottom: 10px;
            line-height: 1.25;
            transition: color 0.3s ease;
        }
        .card.no-mode h1 {
            color: #ffffff;
            text-shadow: 0 0 18px rgba(255, 30, 66, 0.7);
        }

        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 26px;
            font-weight: 500;
        }
        .card.no-mode .subtitle {
            color: #ffb3be;
        }

        /* Кнопки выбора */
        .buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            min-height: 68px;
            position: relative;
        }

        button.choice-btn {
            font-size: 19px;
            font-weight: 800;
            padding: 15px 42px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .btn-yes {
            background: var(--yes-grad);
            color: white;
            box-shadow: 0 10px 25px rgba(56, 176, 0, 0.4);
        }
        .btn-yes:hover {
            transform: translateY(-4px) scale(1.07);
            box-shadow: 0 14px 32px rgba(56, 176, 0, 0.6);
        }

        .btn-no {
            background: var(--no-grad);
            color: white;
            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.4);
        }
        .btn-no:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 14px 32px rgba(217, 4, 41, 0.6);
        }

        /* Блок результата */
        .result {
            font-size: 18px;
            font-weight: 600;
            padding: 0;
            border-radius: 22px;
            max-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(15px) scale(0.95);
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            line-height: 1.45;
        }

        .result.show {
            padding: 22px 18px;
            max-height: 600px;
            opacity: 1;
            transform: translateY(0) scale(1);
            margin-top: 8px;
        }

        .result.yes-result {
            background: linear-gradient(145deg, #ecfdf5, #d1fae5);
            color: #065f46;
            border: 2px solid #6ee7b7;
        }

        .result.no-result {
            background: linear-gradient(145deg, rgba(45, 10, 18, 0.95), rgba(25, 5, 10, 0.95));
            color: #ffe5ec;
            border: 2px solid #ff1e42;
            box-shadow: inset 0 0 25px rgba(255, 30, 66, 0.25);
        }

        /* Терминал с IP 192.168.0.1 */
        .terminal-box {
            width: 100%;
            background: #090a0f;
            border: 1px solid rgba(255, 42, 85, 0.5);
            border-radius: 16px;
            padding: 14px;
            margin: 4px 0;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #ff4d6d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .ip-value {
            font-family: 'Courier New', Consolas, monospace;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00f5d4;
            text-shadow: 0 0 14px rgba(0, 245, 212, 0.6);
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 18px;
            border-radius: 12px;
            border: 2px dashed #ff2a55;
            user-select: all;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            width: 100%;
        }

        .ip-value:hover {
            transform: scale(1.02);
            background: rgba(0, 245, 212, 0.1);
            border-color: #00f5d4;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #fda4af;
        }

        .telemetry-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            border-left: 3px solid #ff2a55;
        }

        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .battle-btn {
            background: linear-gradient(135deg, #ff9e00, #ff0055);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.45);
            transition: all 0.25s ease;
            animation: pulseBtn 1.5s infinite;
        }
        .battle-btn:hover {
            transform: translateY(-2px) scale(1.04);
        }
        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.6); }
            50% { box-shadow: 0 0 0 12px rgba(255, 0, 85, 0); }
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.14);
            color: inherit;
            border: 1px solid currentColor;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
        }

        @media (max-width: 520px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 24px; }
            .ip-value { font-size: 24px; }
            .telemetry-grid { grid-template-columns: 1fr; }
            .game-hud { gap: 16px; padding: 10px 18px; width: 92%; justify-content: space-around; }
            .hud-value { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="honeycomb-bg"></div>
    <div class="bg-gif" id="bgGif"></div>
    <div class="siren-overlay"></div>

    <!-- Верхний HUD для мини-игры -->
    <div class="game-hud" id="gameHud">
        <div class="hud-stat">
            <span class="hud-label">Жизни</span>
            <span class="hud-value" id="hudLives">❤️❤️❤️</span>
        </div>
        <div class="hud-stat">
            <span class="hud-label">Продержаться</span>
            <span class="hud-value" id="hudTimer">20.0с</span>
        </div>
        <div class="hud-stat">
            <span class="hud-label">Очки уклонения</span>
            <span class="hud-value" id="hudScore">0</span>
        </div>
    </div>

    <div class="game-tip" id="gameTip">
        🐝 Уворачивайся курсором от пчёл! Собирай 🍯 для лечения и 💨 для отпугивания роя!
    </div>

    <canvas id="particleCanvas"></canvas>

    <div class="top-controls">
        <button class="icon-btn" id="soundToggle" onclick="toggleMute()">🔊 Звук: ВКЛ</button>
    </div>

    <div class="card" id="card">
        <div class="status-badge" id="statusBadge">🐝 Пасечный Контроль v3.0</div>
        <div class="bee-wrapper">
            <span class="bee-icon" id="beeIcon" onclick="pokeBee()">🐝</span>
        </div>
        <h1 id="mainTitle">Ты уважаешь пчёлок???</h1>
        <p class="subtitle" id="subTitle">От твоего ответа зависит судьба всего улья</p>

        <div class="buttons" id="buttons">
            <button class="choice-btn btn-yes" id="btnYes" onclick="answerYes()">ДА, КОНЕЧНО!</button>
            <button class="choice-btn btn-no" id="btnNo" onmouseenter="evadeNoButton()" onclick="answerNo()">НЕТ</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://dl3s5.zvuch.com/aHR0cDovL2YubXAzcG9pc2submV0L21wMy8wMDQvNjAxLzU3OC80NjAxNTc4Lm1wMw==" type="audio/mpeg">
    </audio>

    <audio id="melstroySound" preload="auto">
        <source src="melstroy.mp3" type="audio/mpeg">
    </audio>

    <script>
        const resultEl = document.getElementById('result');
        const music = document.getElementById('bgMusic');
        const melstroy = document.getElementById('melstroySound');
        const bgGif = document.getElementById('bgGif');
        const card = document.getElementById('card');
        const buttonsEl = document.getElementById('buttons');
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const beeIcon = document.getElementById('beeIcon');
        const statusBadge = document.getElementById('statusBadge');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const soundToggle = document.getElementById('soundToggle');

        // Элементы мини-игры
        const gameHud = document.getElementById('gameHud');
        const gameTip = document.getElementById('gameTip');
        const hudLives = document.getElementById('hudLives');
        const hudTimer = document.getElementById('hudTimer');
        const hudScore = document.getElementById('hudScore');

        // Фиксированный локальный IP вместо реального
        const FAKE_IP = '192.168.0.1';
        const FAKE_GEO = 'Локальная сеть роутера • Улей №1';

        const NO_GIF_URL = 'https://media.tenor.com/ВАША_ССЫЛКА/qoppi.gif';
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569717595798638744/imSH2DpH5ItvI0MtvCEkWH6zoye-IsktwvsUiuGb_5Ws7IroLgHtDeN1TymWvzJJ6ZUt';

        let answered = false;
        let musicStarted = false;
        let isMuted = false;
        let noEvadeCount = 0;
        let particleMode = 'normal';
        let autoGameTimeout = null;

        // ============================================================
        // ВСТРОЕННЫЙ СИНТЕЗАТОР ЗВУКОВ (Web Audio API)
        // ============================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudioCtx() {
            if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
        }

        function playSynthSound(type) {
            if (isMuted) return;
            initAudioCtx();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'yes') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.14, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.55);
                });
            } else if (type === 'no') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(520, now + 0.35);
                osc.frequency.linearRampToValueAtTime(180, now + 0.7);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.8);
            } else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'powerup') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.18);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            } else if (type === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            music.muted = isMuted;
            melstroy.muted = isMuted;
            soundToggle.textContent = isMuted ? '🔇 Звук: ВЫКЛ' : '🔊 Звук: ВКЛ';
        }

        // ============================================================
        // ОТСЛЕЖИВАНИЕ КУРСОРА И КАСАНИЙ
        // ============================================================
        let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        document.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;

            if (gameState.active || window.innerWidth < 768) return;
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const deltaX = (e.clientX - centerX) / 28;
            const deltaY = (centerY - e.clientY) / 28;
            card.style.transform = `rotateY(${Math.max(-10, Math.min(10, deltaX))}deg) rotateX(${Math.max(-10, Math.min(10, deltaY))}deg)`;
        });

            if (e.touches.length > 0) {

                mousePos.y = e.touches[0].clientY;
            }
        }, { passive: true });

        function fadeOutMusic(duration = 1000) {
            const startVolume = music.volume;
            const steps = 20;
            const stepTime = duration / steps;
            let step = 0;
            const fadeInterval = setInterval(() => {

                music.volume = Math.max(0, startVolume * (1 - step / steps));
                if (step >= steps) {
                    clearInterval(fadeInterval);
                    music.pause();
                    music.currentTime = 0;
                }
            }, stepTime);
        }

        function scrambleIpText(elementId, targetText, duration) {
            const el = document.getElementById(elementId);
            const scanStatus = document.getElementById('scanStatus');
            if (!el) return;

            const chars = '0123456789';
            const totalSteps = 20;
            let step = 0;

            const interval = setInterval(() => {
                step++;
                playSynthSound('beep');
                const progress = step / totalSteps;

                let output = '';
                for (let i = 0; i < targetText.length; i++) {
                    if (targetText[i] === '.') {
                        output += '.';
                    } else if (i < targetText.length * progress) {
                        output += targetText[i];
                    } else {
                        output += chars[Math.floor(Math.random() * chars.length)];
                    }
                }
                el.textContent = output;

                if (step >= totalSteps) {
                    clearInterval(interval);
                    el.textContent = targetText;
                    if (scanStatus) scanStatus.textContent = 'ЦЕЛЬ ЗАХВАЧЕНА';
                }
            }, duration / totalSteps);
        }

        // ============================================================
        // CANVAS АНИМАЦИЯ ФОНА И ИГРОВОГО ЦИКЛА
        // ============================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticles() {
            particles = [];
            const count = Math.min(35, Math.floor(window.innerWidth / 35));
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.6,
                    vy: (Math.random() - 0.5) * 1.6 - 0.5,
                    size: 16 + Math.random() * 14,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.03,
                    type: i % 3 === 0 ? '🐝' : (i % 3 === 1 ? '🍯' : '🌼')
                });
            }
        }
        createParticles();

        function updateAndDrawGame(now) {
            const dt = Math.min(0.05, (now - gameState.lastFrameTime) / 1000);
            gameState.lastFrameTime = now;

            gameState.timeLeft -= dt;
            gameState.score += dt * 25;

            if (gameState.timeLeft <= 0) {
                updateHud();
                endDodgeGame(true);
                return;
            }

            // Появление новых пчёл-охотников каждые 1.25 сек
            if (now - gameState.lastSpawn > 1250 && gameState.enemies.length < 22) {
                spawnEnemyBee();
                gameState.lastSpawn = now;
            }

            // Появление бонусов каждые 3.5 сек
            if (now - gameState.lastBonusSpawn > 3500 && gameState.bonuses.length < 3) {
                spawnBonusItem();
                gameState.lastBonusSpawn = now;
            }

            // След за курсором игрока
            gameState.trail.push({ x: mousePos.x, y: mousePos.y, alpha: 0.7, r: 14 });
            if (gameState.trail.length > 14) gameState.trail.shift();

            gameState.trail.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 245, 212, ${t.alpha * 0.25})`;
                ctx.fill();
                t.alpha *= 0.88;
                t.r *= 0.94;
            });

            // Отрисовка бонусов (мёд и дымарь)
            for (let i = gameState.bonuses.length - 1; i >= 0; i--) {
                const b = gameState.bonuses[i];
                if (now - b.born > b.duration) {
                    gameState.bonuses.splice(i, 1);
                    continue;
                }

                // Пульсация бонуса
                const scale = 1 + Math.sin(now * 0.008) * 0.12;
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.scale(scale, scale);
                ctx.font = `${b.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.emoji, 0, 0);
                ctx.restore();

                // Проверка подбора бонуса курсором
                const dist = Math.hypot(mousePos.x - b.x, mousePos.y - b.y);
                if (dist < 32) {
                    playSynthSound('powerup');
                    if (b.type === 'honey') {
                        if (gameState.lives < 3) gameState.lives++;
                        gameState.score += 150;
                        addFloatingText(b.x, b.y, '+1 ❤️ +150', '#70e000');
                    } else {
                        // Дымарь разбрасывает всех пчёл от курсора
                        gameState.score += 200;
                        addFloatingText(b.x, b.y, '💨 ДЫМАРЬ! РОЙ ОТБРОШЕН!', '#00f5d4');
                        gameState.enemies.forEach(en => {
                            const angle = Math.atan2(en.y - mousePos.y, en.x - mousePos.x);
                            en.vx = Math.cos(angle) * 14;
                            en.vy = Math.sin(angle) * 14;
                        });
                    }
                    gameState.bonuses.splice(i, 1);
                }
            }

            // Движение и отрисовка пчёл-охотников
            const isInvulnerable = now < gameState.invulnerableUntil;

            gameState.enemies.forEach(en => {
                en.wobble += 0.12;
                const angleToPlayer = Math.atan2(mousePos.y - en.y, mousePos.x - en.x);

                // Плавное наведение на курсор с небольшим жужжащим зигзагом
                const targetVx = Math.cos(angleToPlayer) * en.speed + Math.cos(en.wobble) * 1.1;
                const targetVy = Math.sin(angleToPlayer) * en.speed + Math.sin(en.wobble) * 1.1;

                en.vx += (targetVx - en.vx) * 0.06;
                en.vy += (targetVy - en.vy) * 0.06;

                en.x += en.vx;
                en.y += en.vy;

                // Отрисовка пчелы
                ctx.save();
                ctx.translate(en.x, en.y);
                ctx.rotate(Math.atan2(en.vy, en.vx));
                ctx.font = `${en.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(en.emoji, 0, 0);
                ctx.restore();

                // Проверка столкновения с игроком
                if (!isInvulnerable) {
                    const dist = Math.hypot(mousePos.x - en.x, mousePos.y - en.y);
                    if (dist < 22) {
                        gameState.lives--;
                        gameState.invulnerableUntil = now + 1300;
                        playSynthSound('hit');
                        addFloatingText(mousePos.x, mousePos.y - 20, '💥 УКУС! -1 ❤️', '#ff2a55');

                        // Отталкиваем укусившую пчелу
                        en.vx = -en.vx * 3;
                        en.vy = -en.vy * 3;

                        if (gameState.lives <= 0) {
                            updateHud();
                            endDodgeGame(false);
                        }
                    }
                }
            });

            // Отрисовка щита/курсора игрока
            ctx.save();
            ctx.translate(mousePos.x, mousePos.y);
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            if (isInvulnerable && Math.floor(now / 90) % 2 === 0) {
                ctx.strokeStyle = '#ffbe0b';
                ctx.fillStyle = 'rgba(255, 190, 11, 0.25)';
            } else {
                ctx.strokeStyle = '#00f5d4';
                ctx.fillStyle = 'rgba(0, 245, 212, 0.2)';
            }
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();

            ctx.font = '20px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🛡️', 0, 0);
            ctx.restore();

            // Всплывающие надписи (+очки / укус)
            for (let i = gameState.floatingTexts.length - 1; i >= 0; i--) {
                const ft = gameState.floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.022;
                if (ft.alpha <= 0) {
                    gameState.floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.font = 'bold 18px "Segoe UI", sans-serif';
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            updateHud();
        }

        function animateParticles(now = performance.now()) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фоновые частицы
            particles.forEach(p => {
                const speedMult = particleMode === 'no' ? 3.2 : (particleMode === 'yes' ? 1.8 : 1);
                p.x += p.vx * speedMult;
                p.y += p.vy * speedMult;
                p.angle += p.spin * speedMult;

                if (p.x < -40) p.x = canvas.width + 40;
                if (p.x > canvas.width + 40) p.x = -40;
                if (p.y < -40) p.y = canvas.height + 40;
                if (p.y > canvas.height + 40) p.y = -40;

                ctx.save();
                ctx.globalAlpha = gameState.active ? 0.22 : 0.85;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.font = `${p.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let symbol = p.type;
                if (particleMode === 'no') symbol = p.type === '🐝' ? '🐝' : '⚡';
                if (particleMode === 'yes') symbol = p.type === '🐝' ? '🐝' : '✨';

                ctx.fillText(symbol, 0, 0);
                ctx.restore();
            });

            // Если активна мини-игра — рисуем игровой слой поверх
            if (gameState.active) {
                updateAndDrawGame(now);
            }

            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);
    </script>
</body>
</html>
